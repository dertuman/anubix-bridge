name: Build & Push Bridge Image

# ────────────────────────────────────────────────────────────────
# Builds the anubix-bridge Docker image and pushes it to GHCR.
#
# The Machines API in anubix-web references this image via the
# BRIDGE_DOCKER_IMAGE env var (e.g. ghcr.io/org/anubix-bridge:latest).
#
# IMPORTANT — after the first successful run:
#   1. Go to GitHub → your profile → Packages → anubix-bridge
#   2. Package settings → Danger Zone → Change visibility → Public
#   This is required so Fly.io can pull the image without auth.
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:       # manual trigger for rebuilds

concurrency:
  group: build-bridge-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo" → lowercased automatically by metadata-action
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Docker layer caching — speeds up subsequent builds significantly
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the image is pullable (catches visibility issues early)
      - name: Verify image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
