app = 'anubix-bridge'
primary_region = 'lhr'

[build]

[env]
  CLAUDE_MODE = 'sdk'
  NODE_ENV = 'production'
  PORT = '8080'
  REPOS_BASE_PATH = '/workspace'

[[mounts]]
  source = 'workspace_data'
  destination = '/workspace'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
